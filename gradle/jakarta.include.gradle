/*
 * Builds a second variant of the plugin, for IIQ 9.0 and later, where the javax.servlet /
 * javax.ws.rs / javax.faces APIs moved to the jakarta namespace. The main build keeps
 * producing the javax variant for IIQ 8.x.
 *
 * A single jar can't serve both, because the types in IIQ's own method signatures differ.
 * So the jakarta source is generated from 'src' at build time and compiled for real against
 * IIQ 9.0 and the jakarta APIs. This mirrors iiq-common-public's scripts/build/jakarta.include.gradle:
 *
 *   1. The .java files in 'src' are copied into build/generated/jakarta-src with an explicit list of
 *      package renames applied (not a blanket javax -> jakarta).
 *   2. Anything in 'src-jakarta' replaces the generated copy of the same file, for classes
 *      that need a real jakarta implementation rather than renamed imports.
 *   3. The 'jakarta' source set compiles the result without any of the javax API libraries
 *      on its classpath.
 *   4. verifyJakartaJar and verifyJakartaPluginJar fail the build if the result still
 *      references a javax API that moved.
 *
 * Inputs:
 *
 *   -Pidw.jakarta.iiqpath=<dir>    identityiq.jar (and connector-bundle-identityiq.jar, if present) from IIQ 9.0.
 *                                  Default: lib when it holds IIQ 9.x jars (the javax variant is then not built),
 *                                  otherwise lib-9.0. The variant is skipped if there is no identityiq.jar there.
 *   -Pidw.jakarta.commonpath=<dir> iiq-common-public-jakarta.jar, the jakarta classifier of iiq-common-public.
 *                                  Committed (default: includes/lib-9.0)
 *
 * Run ./gradlew createJakartaPluginZip to build build/distributions/<name>-jakarta.zip.
 */

/*
 * Package prefixes that moved to jakarta. Each is matched on a package boundary, so
 * 'javax.servlet' will not rewrite 'javax.servletfoo'. javax.annotation, javax.crypto and the
 * rest of Java SE stay where they are.
 */
def jakartaPackages = [
        "servlet",
        "faces",
        "ws.rs",
        "validation",
        "xml.bind",
        "el"
]

def jakartaRenamePattern = ~("\\bjavax\\.(" + jakartaPackages.collect { it.replace(".", "\\.") }.join("|") + ")\\b")

def jakartaOverrideDir = file("${project.rootDir}/src-jakarta")
def jakartaGeneratedDir = layout.buildDirectory.dir("generated/jakarta-src")

/* Maven groups that hold javax APIs, which must never be on the jakarta classpath */
def javaxApiGroups = [
        "javax.servlet",
        "javax.faces",
        "javax.ws.rs",
        "javax.validation",
        "javax.xml.bind",
        "javax.el",
        "javax.inject"
]

/* Jersey 2 is javax. The jakarta equivalents are declared below */
def javaxJerseyGroups = [
        "org.glassfish.jersey.bundles",
        "org.glassfish.jersey.media"
]

def jakartaIiqPath = project.findProperty("idw.jakarta.iiqpath") ?: (jakartaOnly ? "lib" : "lib-9.0")

// The variant is optional: without IIQ 9.x jars there is nothing to compile against, so skip it without failing
if (!file("${jakartaIiqPath}/identityiq.jar").exists()) {
    logger.lifecycle("Skipping the jakarta (IIQ 9.x) variant: no identityiq.jar in ${jakartaIiqPath}")
    return
}

if (jakartaOnly) {
    logger.lifecycle("IIQ 9.x found in lib: building only the jakarta variant")
}

def jakartaIiqLib = fileTree(dir: jakartaIiqPath,
        includes: ["identityiq.jar", "connector-bundle-identityiq.jar"])

def jakartaCommonLib = fileTree(dir: project.findProperty("idw.jakarta.commonpath") ?: "includes/lib-9.0",
        includes: ["iiq-common-public-jakarta.jar"])

sourceSets {
    jakarta {
        java {
            srcDir tasks.register("generateJakartaSource", Sync) {
                group = "build"
                description = "Generates the jakarta variant of the source from 'src' and 'src-jakarta'"

                into jakartaGeneratedDir

                from("src") {
                    // The BeanShell test fixtures and the like in 'src' are not part of the plugin jar
                    include "**/*.java"

                    // Hand-kept versions in src-jakarta win over the generated copies
                    exclude { details ->
                        !details.directory && new File(jakartaOverrideDir, details.relativePath.pathString).exists()
                    }

                    filesMatching("**/*.java") {
                        filter { String line -> line.replaceAll(jakartaRenamePattern, 'jakarta.$1') }
                    }
                }

                from(jakartaOverrideDir)

                includeEmptyDirs = false
            }
        }
    }
}

configurations {
    // iiq-common, bundled into the plugin jar by ProGuard like the main build's obfuscationJars
    jakartaObfuscationJars
    jakartaImplementation.extendsFrom jakartaObfuscationJars

    // The resolved classpaths are where the javax APIs get dropped
    matching { it.name in ["jakartaCompileClasspath", "jakartaRuntimeClasspath"] }.configureEach { configuration ->
        javaxApiGroups.each { group ->
            configuration.exclude group: group
        }
    }

    jakartaCompileOnly {
        // Same libraries as the main build's obfuscateLibraries, except for the ones that are javax-specific
        // (the main build's IIQ jars are a file tree, so they never get copied)
        withDependencies { dependencies ->
            configurations.obfuscateLibraries.allDependencies.withType(ExternalModuleDependency).each { dependency ->
                def javaxSpecific = dependency.group in javaxApiGroups ||
                        dependency.group in javaxJerseyGroups ||
                        // IIQ 9.0 ships a newer ECJ, declared below
                        dependency.name == "ecj"
                if (!javaxSpecific) {
                    dependencies.add(dependency.copy())
                }
            }
        }
    }
}

dependencies {
    jakartaObfuscationJars jakartaCommonLib

    // IIQ's own jars decide whether this can compile: in 8.x their signatures use javax types,
    // which are deliberately absent from the jakarta classpath
    jakartaCompileOnly jakartaIiqLib

    // Matches the 9.0 WAR (see iiq-common's notes/iiq-9.0-migration-checklist.md)
    jakartaCompileOnly group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: '6.0.0'
    jakartaCompileOnly group: 'jakarta.ws.rs', name: 'jakarta.ws.rs-api', version: '3.1.0'
    jakartaCompileOnly group: 'jakarta.xml.bind', name: 'jakarta.xml.bind-api', version: '3.0.0'
    jakartaCompileOnly group: 'jakarta.validation', name: 'jakarta.validation-api', version: '3.0.0'
    jakartaCompileOnly group: 'jakarta.faces', name: 'jakarta.faces-api', version: '4.0.1'
    jakartaCompileOnly group: 'jakarta.el', name: 'jakarta.el-api', version: '5.0.1'
    jakartaCompileOnly(group: 'org.glassfish.jersey.bundles', name: 'jaxrs-ri', version: '3.1.10') {
        transitive = false
    }
    jakartaCompileOnly(group: 'org.glassfish.jersey.media', name: 'jersey-media-multipart', version: '3.1.10') {
        transitive = false
    }

    // IIQ 8.5 and 9.0 ship ECJ 3.29
    jakartaCompileOnly group: 'org.eclipse.jdt', name: 'ecj', version: '3.29.0'
}

tasks.named("compileJakartaJava") {
    dependsOn "generateJakartaSource"
}

def jakartaJar = tasks.register("jakartaJar", Jar) {
    group = "build"
    description = "Assembles the jakarta variant of the plugin classes, for IIQ 9.0 and later"

    archiveClassifier = "jakarta"

    from sourceSets.jakarta.output
}

/*
 * proguard.txt names its own mapping file, and a -printmapping in a configuration file overrides one set
 * on the task, so the jakarta run would overwrite the main build's proguard.map. Give it a copy that
 * writes its mapping next to the jakarta jar instead.
 */
def jakartaProguardConfig = tasks.register("jakartaProguardConfig", Copy) {
    from('proguard.txt') {
        filter { String line -> line.startsWith("-printmapping") ? "-printmapping ${buildDir}/proguard-jakarta.map" : line }
    }
    into "${buildDir}/proguard"
}

/*
 * The libraries on the classpath only matter to ProGuard for resolving references. iiq-common is
 * excluded because it is an input jar, not a library jar.
 */
def obfuscateJakartaJava = tasks.register('obfuscateJakartaJava', proGuardTaskType) {
    group = "build"
    description = "Obfuscates the jakarta variant of the plugin jar and merges iiq-common into it"

    dependsOn jakartaProguardConfig
    configuration file("${buildDir}/proguard/proguard.txt")
    injars jakartaJar
    injars configurations.jakartaObfuscationJars, filter: '!META-INF/MANIFEST.MF'
    outjars "${buildDir}/libs/RR-jakarta-obf.jar"
    libraryjars sourceSets.jakarta.compileClasspath.minus(configurations.jakartaObfuscationJars)

    if (JavaVersion.current().isJava9Compatible()) {
        libraryjars(System.getProperty("java.home") + "/jmods")
    } else {
        libraryjars(System.getProperty("java.home") + "/lib/rt.jar")
        libraryjars(System.getProperty("java.home") + "/lib/jce.jar")
    }
}

/*
 * Compiling without the javax APIs on the classpath is not enough on its own, since IIQ's jar
 * or iiq-common might still pull a javax type into the bytecode. The second check is on the
 * obfuscated jar, which is what actually ships and which also contains iiq-common.
 */
def verifyNoMovedJavax = { Task task, Object jarFile ->
    def pattern = ~("javax/(" + jakartaPackages.collect { it.replace(".", "/") }.join("|") + ")/")
    def offenders = []

    zipTree(jarFile).matching { include "**/*.class" }.each { classFile ->
        // The constant pool stores names as plain UTF-8, so a byte-level search is enough
        if (pattern.matcher(new String(classFile.bytes, "ISO-8859-1")).find()) {
            offenders << classFile.name
        }
    }

    if (!offenders.isEmpty()) {
        throw new GradleException("${jarFile} still references javax APIs that moved to jakarta in: " + offenders.sort().join(", "))
    }
}

tasks.register("verifyJakartaJar") {
    group = "verification"
    description = "Fails if the jakarta plugin classes reference a javax API that moved to jakarta"

    dependsOn jakartaJar
    inputs.files(jakartaJar)

    doLast {
        verifyNoMovedJavax(it, jakartaJar.get().archiveFile.get().asFile)
    }
}

tasks.register("verifyJakartaPluginJar") {
    group = "verification"
    description = "Fails if the obfuscated jakarta jar, including iiq-common, references a javax API that moved to jakarta"

    dependsOn obfuscateJakartaJava
    inputs.files(obfuscateJakartaJava)

    doLast {
        verifyNoMovedJavax(it, file("${buildDir}/libs/RR-jakarta-obf.jar"))
    }
}

// minSystemVersion keeps an 8.x IIQ from installing the jakarta ZIP, which would not load there
registerPluginZip("createJakartaPluginZip", archivesBaseName + "-jakarta.zip", obfuscateJakartaJava,
        { String line -> line.replaceAll(/minSystemVersion="[0-9.]+"/, 'minSystemVersion="9.0"') })

tasks.named("createJakartaPluginZip") {
    dependsOn "verifyJakartaJar", "verifyJakartaPluginJar"
}
